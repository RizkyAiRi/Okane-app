name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Temporarily Disable API Routes for Static Export
        run: |
          mkdir -p temp_disabled_routes
          mv src/app/api temp_disabled_routes/api
          mv src/app/auth/callback temp_disabled_routes/callback

      - name: Build Next.js Web App
        run: npm run build
        env:
          BUILD_FOR_CAPACITOR: 'true'
          NEXT_PUBLIC_SUPABASE_URL: 'https://lkdybbbtvcxtmloyyzzh.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'sb_publishable_Nga4NOIzRoavLOW5kWDZLQ_EDeQ26bs'

      - name: Restore API Routes
        run: |
          mv temp_disabled_routes/api src/app/api
          mv temp_disabled_routes/callback src/app/auth/callback
          rm -rf temp_disabled_routes

      - name: Build Android APK
        run: |
          npx cap sync android
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Okane-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
