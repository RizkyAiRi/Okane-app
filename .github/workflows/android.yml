name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Java (JDK 17)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Temporarily Disable API Routes for Static Export
        run: |
          mkdir -p temp_disabled_routes
          mv src/app/api temp_disabled_routes/api
          mv src/app/auth/callback temp_disabled_routes/callback

      - name: Build Next.js Web App
        run: npm run build

      - name: Restore API Routes
        run: |
          mv temp_disabled_routes/api src/app/api
          mv temp_disabled_routes/callback src/app/auth/callback
          rm -rf temp_disabled_routes

      - name: Build Android APK
        run: |
          npx cap add android || true
          npx cap sync android
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Okane-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
